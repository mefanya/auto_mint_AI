<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Deployer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-light">

    <div class="container-fluid vh-100">
        <div class="row h-100">
            <!-- Левая панель (чат) -->
            <div class="col-md-3 bg-white p-3 border-end">
                <h4 class="text-center">Чат для промта</h4>
                <div id="chat-box" class="border p-2 overflow-auto" style="height: 75vh;">
                    <p><strong>AI:</strong> Введите промт...</p>
                </div>
                <div class="mt-2">
                    <input type="text" id="prompt-input" class="form-control" placeholder="Введите промт...">
                    <button class="btn btn-primary w-100 mt-2" onclick="sendPrompt()">Отправить</button>
                </div>
            </div>

            <!-- Правая панель (данные + кнопка деплоя) -->
            <div class="col-md-9 p-4">
                <h3>Автозаполненные данные</h3>
                <div id="token-details" class="border p-3 bg-white rounded shadow-sm">
                    <p><strong>Название:</strong> <span id="token-name">---</span></p>
                    <p><strong>Символ:</strong> <span id="token-symbol">---</span></p>
                    <p><strong>Количество:</strong> <span id="token-supply">---</span></p>
                    <p><strong>Адрес контракта:</strong> <span id="contract-address">---</span></p>
                </div>
                <button class="btn btn-success mt-3" onclick="deployToken()">🚀 Деплой</button>
            </div>
        </div>
    </div>

    <script>
        function sendPrompt() {
            let promptInput = document.getElementById("prompt-input").value;
            let chatBox = document.getElementById("chat-box");

            if (!promptInput) return;

            chatBox.innerHTML += `<p><strong>Вы:</strong> ${promptInput}</p>`;
            document.getElementById("prompt-input").value = "";

            axios.post("/generate_token", { prompt: promptInput })
                .then(response => {
                    let data = response.data;
                    chatBox.innerHTML += `<p><strong>AI:</strong> ${data.message}</p>`;

                    document.getElementById("token-name").innerText = data.token.name;
                    document.getElementById("token-symbol").innerText = data.token.symbol;
                    document.getElementById("token-supply").innerText = data.token.supply;
                    document.getElementById("contract-address").innerText = "Ожидает деплоя...";
                })
                .catch(error => {
                    chatBox.innerHTML += `<p class="text-danger"><strong>Ошибка:</strong> Не удалось обработать промт.</p>`;
                });
        }

        function deployToken() {
            axios.post("/deploy_token")
                .then(response => {
                    document.getElementById("contract-address").innerText = response.data.contract_address;
                    alert("Токен успешно задеплоен!");
                })
                .catch(error => {
                    alert("Ошибка при деплое токена.");
                });
        }
    </script>

</body>
</html>
